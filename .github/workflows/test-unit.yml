name: Unit & Integration Tests

on:
    pull_request:
        branches:
            - develop

jobs:
    compile_lint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup NodeJS
              uses: actions/setup-node@v4
              with:
                  node-version: 18

            - name: Install Dependencies
              run: npm ci

            - name: Compile Typescript
              run: npm run compile

            - name: Lint Code
              run: npm run lint

            - name: Run Tests
              run: npm run test
